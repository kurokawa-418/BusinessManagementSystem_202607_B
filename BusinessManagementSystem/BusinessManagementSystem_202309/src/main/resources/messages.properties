#共通
COM01I001=現在の入力内容を破棄して、画面遷移します。よろしいですか？
COM01I002=現在の入力内容で更新します。よろしいですか？
COM01I003=システムからログアウトします。よろしいですか？
COM01I004=現在の入力内容を破棄して、画面を更新します。よろしいですか？
COM01I005=入力内容に合わせて{1}を更新します。よろしいですか？
COM01I006=入力内容で{1}します。よろしいですか？
COM01I007=入力内容で{1}し、引き続き新規登録を行います。よろしいですか？
COM01I008=選択したファイルをアップロードします。よろしいですか。
COM01I009={1}が{2}件登録されました。
COM01I010=選択したデータを削除します。よろしいですか。
COM01I011=表示しているデータを削除します。よろしいですか。
COM01I012=選択したデータを出力します。よろしいですか。
COM01I013=表示しているデータを出力します。よろしいですか。
COM01W001={1}の検索結果は0件です。条件を変更し、再度検索してください。
COM01W002=該当データは参照中に他のユーザ「{1}」が更新したため、データを再度読み込みました。
COM01W003=対象が選択されていません。対象を選択してください。
COM01E001={1}は必ず入力してください。
COM01E002={1}と{2}の入力内容の前後関係が正しくありません。
COM01E003={1}({2}など)で入力してください。
COM01E004={1}に入力した{2}：{3}は存在しません。
COM01E005=該当データはすでに削除されています。
COM01E006=該当データは他のユーザ「{1}」が編集中です。
COM01E007=該当データは参照中に他のユーザ「{1}」が更新しました。データを再度読み込んでください。
COM01E008=ファイルが選択されていません。
COM01E009={1}ファイルを選択してください。
COM01E010=コピー対象が複数選択されています。
COM01E011={1}に入力した{2}は{3}にすでに存在しています。
COM01E012=セッション情報が存在しません。ログイン画面に戻ります。
COM01E013=セッションタイムアウトしました。ログイン画面に戻します。
COM01E014=ファイルフォーマットに誤りがあります。{1}

#ログイン
LOG01E001=ユーザ名またはパスワードに誤りがあります。
#パスワード変更
PAS01E001=旧パスワードに誤りがあります。
PAS01E002=新パスワードに旧パスワードと同じパスワードが入力されています。
PAS01E003=新パスワードと新パスワード(確認)のパスワードが一致しません。
#労働時間計算
WHC01I001=入力内容から労働時間を計算し、各種時間を更新します。よろしいですか？
WHC01W001={1}日は休日となっていますが、出退時間、退出時間が入力されています。続行してよろしいですか？
WHC01W002={1}日の{2}の入力内容が他の時間から計算した時間と一致していません。続行してよろしいですか？
WHC01E001={1}日は勤務日ですが、{2}が入力されていません。必ず入力してください。
WHC01E002=社員番号には3桁以下の整数を入力してください。
WHC01E003=【社員番号】{1}, 【社員氏名】{2}, 【登録年月】{3} のデータは他のユーザ「{4}」が編集中です。
WHC02I001={1}月度の給与計算用CSVを出力します。よろしいですか。
#勤怠情報
AMI01W001={1}に休日が入力されています。続行してよろしいですか。
AMI01W002={1}に平日が入力されています。続行してよろしいですか。
AMI02W001={1}のアップロードで想定される項目と一致しません。
#カレンダー
CLD01I001={1}～{2}のカレンダーを暦通りで登録します。よろしいですか。
CLD01W001=登録しようとしている年月の中に登録済みのデータが存在します。上書きしてよろしいですか。登録済みデータ：{1}
CLD01E001=登録しようとしている年月の中に編集中のデータが存在します。編集中データ：{1}


